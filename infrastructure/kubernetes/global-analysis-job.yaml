# NOTE: Deploy tooling replaces `__IMAGE_TAG__` with a concrete image tag.
apiVersion: batch/v1
kind: Job
metadata:
  name: global-analysis-manual-__JOB_SUFFIX__
  namespace: default
  labels:
    app: buildatlas-pipelines
    job: global-analysis-manual
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: buildatlas-pipelines
        job: global-analysis-manual
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: aistartuptr.azurecr.io/buildatlas-pipelines:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          command:
            - /opt/buildatlas/startup-analysis/infrastructure/vm-cron/lib/runner.sh
          args:
            - global-analysis-manual
            - "120"
            - /opt/buildatlas/startup-analysis/infrastructure/vm-cron/jobs/global-analysis.sh
            - "__PERIOD__"
            - "__CONCURRENT__"
            - "__MAX_STARTUPS__"
            - "__STARTUP_FILE__"
          envFrom:
            - configMapRef:
                name: buildatlas-pipelines-config
            - secretRef:
                name: buildatlas-pipelines-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
