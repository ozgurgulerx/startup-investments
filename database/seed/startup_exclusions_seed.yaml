# Seed startup_exclusions — known Turkish non-startup entities.
#
# Loader: python main.py seed-startup-exclusions (PR #4.1–4.2)
# Upsert via (entity_name_norm, region).
#
# `overridden_by_startup_id` is set later via a UUID lookup in the
# `startups` table for the venture/lab arm, so the exclusion fires on
# the parent brand but not on the startup spinoff. The loader leaves
# this NULL at seed time; PR #4.2 resolves overrides at ingest start.

